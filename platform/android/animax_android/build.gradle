apply plugin: 'com.android.library'
apply from: file("../jacoco.gradle")
apply from: file("../deps.gradle")
apply from: file("../publish.gradle")
import org.json.simple.JSONObject

ext.ABI_FILTERS = ['armeabi-v7a', 'armeabi', 'arm64-v8a', 'x86']

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles "consumer-rules.pro"

        packagingOptions {
            if(enable_lynx_android_test.toBoolean()) {
                pickFirst 'lib/*/libc++_shared.so'
                pickFirst 'lib/*/liblynxtrace.so'
                pickFirst 'lib/*/liblynxbase.so'
                pickFirst 'lib/*/libskity.so'
                pickFirst 'lib/*/libtttext_lite.so'
            } else {
                exclude 'lib/*/liblynxtrace.so'
                exclude 'lib/*/liblynxbase.so'
                exclude 'lib/*/libskity.so'
            }
        }

        multiDexEnabled true
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    cppFlags  '-fsanitize=address',
                              '-fsanitize-address-use-after-scope',
                              '-fPIE',
                              '-Wl,-ldl',
                              '-Wl,-llog',
                              '-Wno-unused-command-line-argument'
                    arguments '-DANDROID_ARM_MODE=arm',
                              '-DENABLE_ASAN=true',
                              '-DANDROID_STL=c++_shared',
                              '-DFLAVOR_NAME=asan'
                    abiFilters(*(rootProject.ext.abiList.grep{ it != 'x86' }))
                }
            }
        }
        noasan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    cppFlags '-Wl,-ldl',
                            '-Wno-unused-command-line-argument'
                    arguments '-DANDROID_STL=c++_shared',
                              '-DFLAVOR_NAME=noasan'
                }
            }
            getIsDefault().set(true)
        }
    }

    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_PLATFORM=android-18',
                              '-DANDROID_TOOLCHAIN=clang',
                              '-DANDROID_LD=lld',
                              '-DANDROID_STL=c++_shared',
                              '-DLOCAL_ARM_NEON=true',
                              '-DBUILD_TYPE=release',
                              '-LH'
                }
            }
            ndk {
                abiFilters(*(rootProject.ext.abiList.grep{ it != 'x86' }))
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_PLATFORM=android-18',
                              '-DANDROID_TOOLCHAIN=clang',
                              '-DANDROID_LD=lld',
                              '-DANDROID_STL=c++_shared',
                              '-DLOCAL_ARM_NEON=true',
                              '-DBUILD_TYPE=debug',
                              '-LH'
                    cppFlags  '-g -O0'
                }
            }
            ndk {
                abiFilters(*(rootProject.ext.abiList.grep{ it != 'x86' }))
            }
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            // This is an empty CMakeLists. The actual build process is in buildWithGN function
            // This logic is reserved so that gradle can trigger task of externalNativeBuild
            path "CMakeLists.txt"
            version CMAKE_VERSION
        }
    }

    buildFeatures {
        // Enable prefab to link libskity.so in skity AAR
        prefab true
    }

    sourceSets {
        androidTest {
            assets.srcDirs = ['src/android_test/assets']
            java.srcDirs += ['src/android_test/java/']
            manifest.srcFile 'src/android_test/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations {
        extractJNI
    }
}

// Configure the compilation parameters in gn to generate the corresponding CMakeLists.txt files.
task configGnCompileParas {
    println "Root project: ${rootProject.name}"
    def buildVariantList = getFlavorNamesAndBuildTypes(project)
    def flavorNames = buildVariantList[0]
    def buildTypes = buildVariantList[1]
    JSONObject gnBuildArgs_map = new JSONObject()
    flavorNames.each{
        JSONObject gnBuildArgsList = new JSONObject()
        String flavorName = it
        if (flavorName == "asan") {
            gnBuildArgsList.put("is_asan", "true")
        } else {
            gnBuildArgsList.put("is_asan", "false")
        }

        buildTypes.each{
            JSONObject gnBuildArgs_list = new JSONObject(gnBuildArgsList)
            String buildType = it
            gnBuildArgs_list.put("build_lepus_compile", "false")
            gnBuildArgs_list.put("enable_lto", "\"$enable_lto\"")
            if (buildType == "release") {
                gnBuildArgs_list.put("is_debug", "false")
            } else if(buildType == "debug") {
                gnBuildArgs_list.put("is_debug", "true")
                if(enable_lynx_android_test.toBoolean()){
                    gnBuildArgs_list.put("enable_animax_android_testing", "true")
                }
            }
            rootProject.ext.abiList.each { abi -> 
                gnBuildArgs_map.put(flavorName+buildType+abi, gnBuildArgs_list)
            }
        }
    }
    writeGnArgs(gnBuildArgs_map.toJSONString())
}

dependencies {
    implementation project.ext.appcompat
    implementation "org.lynxsdk.lynx:skity-native:${project.ext.SKITY_VERSION}"
    implementation "org.lynxsdk.lynx:lynx-base:${project.ext.LYNX_VERSION}"
    implementation "org.lynxsdk.lynx:lynx-trace:${project.ext.LYNX_VERSION}"
    extractJNI "org.lynxsdk.lynx:lynx-base:${project.ext.LYNX_VERSION}@aar"
    extractJNI "org.lynxsdk.lynx:lynx-trace:${project.ext.LYNX_VERSION}@aar"
}

task extractJNIFiles {
    doLast {
        delete "$projectDir/build/jniLibs/lynx"
        configurations.extractJNI.files.each {
            def file = it.absoluteFile
            def packageName = file.name.tokenize('-')[0]
            println("extractJNI: " + packageName)
            copy {
                from zipTree(file)
                into "$projectDir/build/jniLibs/$packageName/"
                include "jni/**/*"
            }
        }
        def extractedFiles = fileTree("$projectDir/build/jniLibs/lynx").matching {
            include 'jni/**/liblynxbase.so'
            include 'jni/**/liblynxtrace.so'
        }
        if (extractedFiles.isEmpty()) {
            throw new GradleException("No Lynx native libraries were extracted into $projectDir/build/jniLibs/lynx")
        }
    }
}

preBuild.dependsOn extractJNIFiles
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('generateJsonModel') || task.name.startsWith('externalNativeBuild')) {
        task.dependsOn extractJNIFiles
    }
}
