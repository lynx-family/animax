apply plugin: 'maven-publish'
apply plugin: 'signing'
import org.gradle.api.internal.artifacts.dependencies.DefaultExternalModuleDependency
import org.gradle.api.internal.artifacts.dependencies.DefaultProjectDependency
import groovy.json.JsonOutput

def getAARPath(buildPath, boolean isDev = false) {
    def filePattern
    if (isDev) {
        filePattern = "**/*dev-release.aar"
    } else {
        def hasNoasanFlavor = project.android.productFlavors.any { it.name == "noasan" }
        filePattern = hasNoasanFlavor ? "**/*noasan-release.aar" : "**/*release.aar"
    }
    FileTree fileTree = project.fileTree(dir: buildPath, includes: [filePattern])
    if (fileTree.isEmpty()) {
        throw new GradleException("No AAR found in path '${buildPath}' with pattern '${filePattern}'")
    }
    return fileTree.files[0]
}

boolean isPublishModule() {
    def releaseModulePaths = rootProject.ext.has('releaseModulePaths') ? rootProject.ext.releaseModulePaths : [':AnimaXAndroid', ':AnimaXTextra'] as Set
    def releaseModuleNames = rootProject.ext.has('releaseModuleNames') ? rootProject.ext.releaseModuleNames : ['AnimaXAndroid', 'AnimaXTextra'] as Set
    def releaseArtifactNames = rootProject.ext.has('releaseArtifactNames') ? rootProject.ext.releaseArtifactNames : ['animax-sdk', 'animax-textra'] as Set
    return releaseModulePaths.contains(project.path) &&
            releaseModuleNames.contains(project.name) &&
            releaseArtifactNames.contains(project.findProperty('ARTIFACT_NAME'))
}

boolean isJavaModule() {
    boolean result = ((project.plugins.hasPlugin('java-library')
            || project.plugins.hasPlugin('java'))
            && !isAndroidModule())
    return result
}

boolean isAndroidModule() {
    boolean result = project.plugins.hasPlugin('com.android.library')
    return result
}

boolean shouldConfigurePublishing() {
    def runTasks = gradle.startParameter.taskNames.toString().toLowerCase()
    return runTasks.contains("publish") || runTasks.contains("stagereleasemavenartifacts")
}

def getReleaseVersion() {
    def releaseVersion = findProperty("VERSION") ?: findProperty("version")
    if (!releaseVersion) {
        throw new GradleException("Missing VERSION. Please pass -PVERSION=<ver>")
    }
    return releaseVersion
}

boolean hasDevFlavor() {
    if (!isAndroidModule() || !project.android.productFlavors.any { it.name == "dev" }) {
        return false
    }
    def executedTasks = gradle.startParameter.taskNames*.toLowerCase()    
    boolean isDevTaskExecuted = executedTasks.any { taskName ->
        taskName.contains("dev")
    }
    return isDevTaskExecuted
}

Task createSourceJar(String baseName) {
    return project.tasks.create("${baseName}Jar", Jar) {
        if (project.gradle.gradleVersion >= '8.0') {
            archiveBaseName = baseName
            it.setArchiveClassifier('sources')
        } else {
            baseName = baseName
            classifier = 'sources'
        }

        project.android.libraryVariants.all { variant ->
            try {
                from variant.variantData.javaSources.collect { it.getDir() }
            } catch (Exception e) {
                from variant.sourceSets.collect { it.java.getSrcDirs() }
            }
        }

        exclude '**/BuildConfig.java'
        exclude '**/R.java'
    }
}

def configureSigning(pom) {
    def signingKeyId = findProperty("signing.keyId")
    def signingPassword = findProperty("signing.password")
    def signingSecretKey = findProperty("signing.secretKey")
    if (signingKeyId != null && signingKeyId != "") {
        useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
        sign pom
    }
}

def addDependenciesToPom(Node pomNode) {
    def dependenciesNode = pomNode.appendNode('dependencies')
    configurations.implementation.allDependencies.each { dependency ->
        if (dependency instanceof DefaultExternalModuleDependency) {
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', dependency.group)
            dependencyNode.appendNode('artifactId', dependency.name)
            dependencyNode.appendNode('version', dependency.version)
            dependencyNode.appendNode('scope', 'runtime')
        } else if (dependency instanceof DefaultProjectDependency) {
            String scope = "runtime"
            if (configurations.api.dependencies.contains(dependency)) {
                scope = "compile"
            }
            def dependencyProject = dependency.dependencyProject
            def artifactId = dependencyProject.findProperty('ARTIFACT_NAME')
            def groupId = dependencyProject.findProperty('ARTIFACT_GROUP')
            def dependencyVersion = dependency.version
            if (dependencyVersion == null || dependencyVersion == "unspecified") {
                dependencyVersion = getReleaseVersion()
            }
            if (artifactId == null || groupId == null || dependencyVersion == null) {
                logger.lifecycle("Skip dependency ${dependencyProject.path} in pom because Maven coordinates are incomplete.")
                return
            }
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', groupId)
            dependencyNode.appendNode('artifactId', artifactId)
            dependencyNode.appendNode('version', dependencyVersion)
            dependencyNode.appendNode('scope', scope)
        }
    }
}

afterEvaluate {
    // Configure publications only for explicit Maven staging/publish tasks.
    if (shouldConfigurePublishing() && isPublishModule()) {
        publishing {
            publications {
                if (isJavaModule()) {
                    "jar"(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version getReleaseVersion()
                        from components.java
                        task sourceJar(type: Jar) {
                            if (project.gradle.gradleVersion >= '8.0') {
                                it.setArchiveClassifier('sources')
                            } else {
                                classifier = 'sources'
                            }
                            from sourceSets.main.allSource
                        }
                        task javadocJar(type: Jar) {
                            if (project.gradle.gradleVersion >= '8.0') {
                                it.setArchiveClassifier('javadoc')
                            } else {
                                classifier = 'javadoc'
                            }
                            from sourceSets.main.java
                        }
                        artifact(sourceJar)
                        artifact(javadocJar)
                        pom {
                            name = artifactId
                            url = REPOSITORY_URL
                            description = DESCRIPTION
                            licenses {
                                license {
                                    name = 'The Apache License, version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }
                            developers {
                                developer {
                                    name = DEVELOPER_NAME
                                    email = DEVELOPER_EMAIL
                                }
                            }
                            scm {
                                url = REPOSITORY_URL
                                connection = "scm:git:git://$REPOSITORY_SSH_URL"
                                developerConnection = "scm:git:ssh://$REPOSITORY_SSH_URL"
                            }
                            signing {
                                def signingKeyId = findProperty("signing.keyId")
                                def signingPassword = findProperty("signing.password")
                                def signingSecretKey = findProperty("signing.secretKey")
                                if (signingKeyId != null && signingKeyId != "") {
                                    useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
                                    sign publishing.publications.jar
                                }
                            }
                        }
                    }
                } else if (isAndroidModule()) {
                    release(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version getReleaseVersion()
                        artifact(getAARPath("$project.buildDir/outputs/aar"))
                        // collect source jar and add it into the component artifact.
                        Task sourceJar = createSourceJar("release-source")
                        artifact sourceJar
                        pom {
                            name = artifactId
                            url = REPOSITORY_URL
                            description = DESCRIPTION
                            licenses {
                                license {
                                    name = 'The Apache License, version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }
                            developers {
                                developer {
                                    name = DEVELOPER_NAME
                                    email = DEVELOPER_EMAIL
                                }
                            }
                            scm {
                                url = REPOSITORY_URL
                                connection = "scm:git:git://$REPOSITORY_SSH_URL"
                                developerConnection = "scm:git:ssh://$REPOSITORY_SSH_URL"
                            }
                            signing {
                                def signingKeyId = findProperty("signing.keyId")
                                def signingPassword = findProperty("signing.password")
                                def signingSecretKey = findProperty("signing.secretKey")
                                if (signingKeyId != null && signingKeyId != "") {
                                    useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
                                    sign publishing.publications.release
                                }
                            }
                            withXml {
                                addDependenciesToPom(asNode())
                            }
                        }
                    }
                }
                if (hasDevFlavor()) {
                    devRelease(MavenPublication) {
                        groupId ARTIFACT_GROUP
                        artifactId ARTIFACT_NAME
                        version getReleaseVersion()
                        artifact(getAARPath("$project.buildDir/outputs/aar", true))
                        // collect source jar and add it into the component artifact.
                        Task sourceJarDev = createSourceJar("dev-sources")
                        artifact sourceJarDev
                        pom {
                            name = artifactId
                            url = REPOSITORY_URL
                            description = DESCRIPTION
                            licenses {
                                license {
                                    name = 'The Apache License, version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }
                            developers {
                                developer {
                                    name = DEVELOPER_NAME
                                    email = DEVELOPER_EMAIL
                                }
                            }
                            scm {
                                url = REPOSITORY_URL
                                connection = "scm:git:git://$REPOSITORY_SSH_URL"
                                developerConnection = "scm:git:ssh://$REPOSITORY_SSH_URL"
                            }
                            signing {
                                def signingKeyId = findProperty("signing.keyId")
                                def signingPassword = findProperty("signing.password")
                                def signingSecretKey = findProperty("signing.secretKey")
                                if (signingKeyId != null && signingKeyId != "") {
                                    useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
                                    sign publishing.publications.devRelease
                                }
                            }
                            withXml {
                                addDependenciesToPom(asNode())
                            }
                        }
                    }
                }
            }
            repositories {
                maven {
                    url = "$project.buildDir/release"
                }
            }
        }
    }
    tasks.withType(PublishToMavenRepository) { task ->
        task.doFirst {
            repository.url = "$project.buildDir/release/${publication.version}"
        }
    }
}

def artifactList = []

task zipArtifacts {
    onlyIf {
        isPublishModule()
    }
    doLast {
        def artifactPath = "${project.buildDir}/release"
        def version = getReleaseVersion()
        def zipPath = file("${project.buildDir}/${project.ARTIFACT_NAME}-${version}.zip")
        if (!file(artifactPath).exists()) {
            throw new GradleException("No Maven release directory found at ${artifactPath}")
        }
        ant.zip(destfile: zipPath, basedir: artifactPath)
        artifactList.add(zipPath.absolutePath)
    }
}

task getArtifactList {
    onlyIf {
        isPublishModule()
    }
    dependsOn(zipArtifacts)
    doLast {
        println "artifactInfo: ${artifactList}"
        File file = new File("${project.buildDir}/artifact-list")
        file.text = JsonOutput.toJson(artifactList)
    }
}
