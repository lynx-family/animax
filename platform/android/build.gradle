buildscript {
    ext {
        kotlin_version = '1.5.32'
        compileSdkVersion = 30
        ndkVersion = '21.1.6352462'
        abiList = project.hasProperty('abiList') ? project.property('abiList').split(',').collect { it.trim() }.findAll { it } : ['armeabi-v7a', 'arm64-v8a', 'x86_64']

        pythonExec = project.file(python_exec).absolutePath
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.googlecode.json-simple:json-simple:1.1.1'
    }
}

apply from: file("../../tools/gradle/versions.gradle")

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

ext.getCppLib = {
    if (project.hasProperty('use_cpp_shared') && project.property('use_cpp_shared') == 'true') {
        return 'c++_shared'
    }
    if (project.hasProperty('use_cpp_static') && project.property('use_cpp_static') == 'true') {
        return 'c++_static'
    }
    return 'c++_static'
}

ext.getFlavorNamesAndBuildTypes = { Project project ->
    def flavorNames = []
    def buildTypes = []
    project.android.productFlavors.all { flavor ->
        flavorNames << flavor.name
    }
    project.android.buildTypes.all { buildType ->
        buildTypes << buildType.name
    }
    def runTasks = gradle.startParameter.taskNames.toString().toLowerCase()
    if (runTasks == "[]") {
        if (gradle.parent != null) {
            runTasks = gradle.parent.startParameter.taskNames.toString().toLowerCase()
        }
    }
    if (runTasks.contains("generateAllGnCmakeTargets".toLowerCase()) || runTasks.contains("clean")) {
        return [flavorNames, buildTypes]
    }
    if (!(runTasks.contains("release") || runTasks.contains("publish"))) {
        buildTypes -= "release"
    }
    if (!runTasks.contains("debug")) {
        buildTypes -= "debug"
    }
    return [flavorNames, buildTypes]
}

ext.writeGnArgs = { String gnArgs ->
    exec {
        workingDir "../../"
        commandLine pythonExec, "tools_shared/android_tools/write_gn_args.py", "--gn-args", gnArgs.replaceAll('"', '#')
    }
}

task generateAllGnCmakeTargets {
    evaluationDependsOnChildren()

    rootProject.allprojects { Project project ->
        if(project.tasks.findByName('configGnCompileParas')) {
            println project.name + " has configGnCompileParas task."
            dependsOn project.configGnCompileParas
        }
    }
    doLast {
        exec {
            workingDir "../../"
            commandLine pythonExec, "tools_shared/android_tools/generate_cmake_scripts_from_gn.py"
            println commandLine
        }
    }
}

gradle.projectsEvaluated {
    rootProject.allprojects { Project project ->
        project.tasks.matching {
            it.name.startsWith('generateJsonModel') || it.name.startsWith('externalNativeBuild')
        }.all {
            dependsOn rootProject.generateAllGnCmakeTargets
        }
    }
}

task clean(type: Delete) {
    dependsOn generateAllGnCmakeTargets
    dependsOn subprojects*.tasks*.matching { it.name.contains('clean') }
    doLast {
        exec {
            workingDir "../../"
            commandLine pythonExec, "tools_shared/android_tools/generate_cmake_scripts_from_gn.py", "--clean"
            println commandLine
        }
    }
}

apply from: file("./package.gradle")
