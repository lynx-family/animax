apply plugin: 'com.android.library'
apply from: 'https://voffline.byted.org/download/tos/schedule/ttclient-android/publish.gradle'
apply from: file("../jacoco.gradle")
apply from: file("../deps.gradle")

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        packagingOptions {
            if(enable_lynx_android_test.toBoolean()) {
                pickFirst 'lib/*/libc++_shared.so'
                pickFirst 'lib/*/liblynxtrace.so'
                pickFirst 'lib/*/libnapi.so'
                pickFirst 'lib/*/libskity.so'
                pickFirst 'lib/*/libtttext_lite.so'
            } else {
                exclude 'lib/*/libc++_shared.so'
                exclude 'lib/*/liblynxtrace.so'
                exclude 'lib/*/libnapi.so'
                exclude 'lib/*/libskity.so'
                exclude 'lib/*/libtttext_lite.so'
                exclude 'lib/*/libanimax.so'
            }
        }

        multiDexEnabled true
    }

    sourceSets {
        androidTest {
            assets.srcDirs = ['src/android_test/assets']
            java.srcDirs += ['src/android_test/java/']
            manifest.srcFile 'src/android_test/AndroidManifest.xml'
        }
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
        }
        noasan {
            dimension "lynx"
            getIsDefault().set(true)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project.ext.appcompat
    implementation project(':AnimaXAndroid')

    // fresco
    if (enable_lynx_android_test.toBoolean()) {
        implementation project.ext.bytedance_fresco
    } else {
        compileOnly project.ext.bytedance_fresco
    }

    // auto service
    compileOnly project.ext.auto_service
    if (!enable_lynx_android_test.toBoolean()) {
        annotationProcessor project.ext.auto_service
    }
}