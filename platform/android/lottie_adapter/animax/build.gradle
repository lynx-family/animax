apply plugin: 'com.android.library'
apply from: 'https://voffline.byted.org/download/tos/schedule/ttclient-android/publish.gradle'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles "consumer-rules.pro"

        multiDexEnabled true
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
        }
        noasan {
            dimension "lynx"
            getIsDefault().set(true)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.0.0"

    implementation project(':LottieAdapterBase')

    implementation project(':AnimaXAndroid')
    implementation "com.bytedance.skity:skity:${rootProject.ext.SKITY_VERSION}"
}
