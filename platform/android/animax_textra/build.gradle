apply plugin: 'com.android.library'
apply from: file("../jacoco.gradle")
apply from: file("../deps.gradle")
apply from: file("../publish.gradle")
import org.json.simple.JSONObject

ext.ABI_FILTERS = ['armeabi-v7a', 'armeabi', 'arm64-v8a', 'x86']
// AnimaXTextra links libanimax from AnimaXAndroid, which currently does not
// build x86. Keep the supported ABI set aligned to avoid x86 link failures.
ext.TEXTRA_SUPPORTED_ABIS = ['armeabi-v7a', 'arm64-v8a']

def getTextraAbiList() {
    def abis = rootProject.ext.abiList.grep { project.ext.TEXTRA_SUPPORTED_ABIS.contains(it) }
    if (abis.isEmpty()) {
        throw new GradleException("AnimaXTextra binary build has no supported ABI in ${rootProject.ext.abiList}; supported ABIs are ${project.ext.TEXTRA_SUPPORTED_ABIS}.")
    }
    return abis
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 29
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        packagingOptions {
            if(enable_lynx_android_test.toBoolean()) {
                pickFirst 'lib/*/libc++_shared.so'
                pickFirst 'lib/*/liblynxtrace.so'
                pickFirst 'lib/*/libnapi.so'
                pickFirst 'lib/*/libskity.so'
                pickFirst 'lib/*/liblynxtextra.so'
                pickFirst 'lib/*/libanimax.so'
            } else {
                exclude 'lib/*/libc++_shared.so'
                exclude 'lib/*/liblynxtrace.so'
                exclude 'lib/*/libnapi.so'
                exclude 'lib/*/libskity.so'
                exclude 'lib/*/libanimax.so'
                exclude 'lib/*/liblynxtextra.so'
            }
        }
    }

    flavorDimensions "lynx"
    productFlavors {
        asan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    cppFlags  '-fsanitize=address',
                              '-fsanitize-address-use-after-scope',
                              '-fPIE',
                              '-Wl,-ldl',
                              '-Wl,-llog',
                              '-Wno-unused-command-line-argument'
                    arguments '-DANDROID_ARM_MODE=arm',
                              '-DENABLE_ASAN=true',
                              '-DANDROID_STL=c++_shared',
                              '-DFLAVOR_NAME=asan'
                    abiFilters(*getTextraAbiList())
                }
            }
        }
        noasan {
            dimension "lynx"
            externalNativeBuild {
                cmake {
                    cppFlags '-Wl,-ldl',
                            '-Wno-unused-command-line-argument'
                    arguments '-DANDROID_STL=c++_shared',
                              '-DFLAVOR_NAME=noasan'
                }
            }
            getIsDefault().set(true)
        }
    }

    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_PLATFORM=android-18',
                              '-DANDROID_TOOLCHAIN=clang',
                              '-DANDROID_LD=lld',
                              '-DANDROID_STL=c++_shared',
                              '-DLOCAL_ARM_NEON=true',
                              '-DBUILD_TYPE=release',
                              '-LH'
                }
            }
            ndk {
                abiFilters(*getTextraAbiList())
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_PLATFORM=android-18',
                              '-DANDROID_TOOLCHAIN=clang',
                              '-DANDROID_LD=lld',
                              '-DANDROID_STL=c++_shared',
                              '-DLOCAL_ARM_NEON=true',
                              '-DBUILD_TYPE=debug',
                              '-LH'
                    cppFlags  '-g -O0'
                }
            }
            ndk {
                abiFilters(*getTextraAbiList())
            }
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            // This is an empty CMakeLists. The actual build process is in buildWithGN function
            // This logic is reserved so that gradle can trigger task of externalNativeBuild
            path "CMakeLists.txt"
            version CMAKE_VERSION
        }
    }

    buildFeatures {
        // Enable prefab to link native libraries from binary AAR dependencies.
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Configure the compilation parameters in gn to generate the corresponding CMakeLists.txt files.
task configGnCompileParas {
    println "Root project: ${rootProject.name}"
    def buildVariantList = getFlavorNamesAndBuildTypes(project)
    def flavorNames = buildVariantList[0]
    def buildTypes = buildVariantList[1]
    JSONObject gnBuildArgs_map = new JSONObject()
    flavorNames.each{
        JSONObject gnBuildArgsList = new JSONObject()
        String flavorName = it
        if (flavorName == "asan") {
            gnBuildArgsList.put("is_asan", "true")
        } else {
            gnBuildArgsList.put("is_asan", "false")
        }

        buildTypes.each{
            JSONObject gnBuildArgs_list = new JSONObject(gnBuildArgsList)
            String buildType = it
            gnBuildArgs_list.put("enable_lto", "\"$enable_lto\"")
            if (buildType == "release") {
                gnBuildArgs_list.put("is_debug", "false")
            } else if(buildType == "debug") {
                gnBuildArgs_list.put("is_debug", "true")
                if(enable_lynx_android_test.toBoolean()){
                    gnBuildArgs_list.put("enable_animax_android_testing", "true")
                }
            }
            getTextraAbiList().each { abi ->
                gnBuildArgs_map.put(flavorName+buildType+abi, gnBuildArgs_list)
            }
        }
    }
    writeGnArgs(gnBuildArgs_map.toJSONString())
}

dependencies {
    implementation project(':AnimaXAndroid')
    implementation "org.lynxsdk.lynx:lynxtextra:${project.ext.TEXTRA_VERSION}"
    implementation "org.lynxsdk.lynx:skity-native:${project.ext.SKITY_VERSION}"
}
