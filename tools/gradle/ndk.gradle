import groovy.json.JsonOutput
import groovy.json.JsonSlurper

def ndk27Value = rootProject.findProperty('ndk27')?.toString()
def useNdk27 = ndk27Value != null && ndk27Value.equalsIgnoreCase('true')
def ndkVersionOverride = rootProject.findProperty('ndk_version')?.toString()
rootProject.ext.ndkVersion = ndkVersionOverride ?:
        (useNdk27 ? '27.3.13750724' : '21.1.6352462')

// Resolve after evaluating Android modules so GN uses the same NDK as AGP.
rootProject.ext.configureGnNdk = {
    def ndkDirectory = rootProject.project(':AnimaXAndroid').android.ndkDirectory
    def gnArgsFile = rootProject.file('../../out/android/gn_args/gn_args.json')
    def gnArgs = new JsonSlurper().parse(gnArgsFile)
    gnArgs.values().each { variantArgs ->
        variantArgs.overlay_ndk_dir = ndkDirectory.absolutePath.replace('\\', '/')
    }
    gnArgsFile.text = JsonOutput.toJson(gnArgs)
}
