# jni register file configs.
jni_register_configs:
  output_path: platform/android/animax_android/src/main/jni/gen/animax_so_load.cc
  custom_headers:
    - base/include/platform/android/jni_utils.h
  namespaces:
    - animax
# gn file configs.
gn_configs:
  output_path: platform/android/animax_android/src/main/jni/BUILD.gn
  template_name: animax_source_set
  custom_headers:
    - src/animax.gni
# jni files configs.
