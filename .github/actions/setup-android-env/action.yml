name: setup android enviroment

description: Setup Android enviroment, which includes JDK, Android SDK and NDK.

runs:
  using: composite
  steps:
    - name: Setup Java SDK
      uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
      with:
        java-version: 11
        distribution: 'zulu'
    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        cmdline-tools-version: 9862592
    - name: Setup Android NDK
      shell: bash
      run: |-
        sdkmanager "ndk;21.1.6352462"
        {
          echo "ANDROID_SDK=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.1.6352462"
          echo "ANDROID_NDK_21=$ANDROID_HOME/ndk/21.1.6352462"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.1.6352462"
        } >> "$GITHUB_ENV"
