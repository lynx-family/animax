name: install common dependencies

description: pull common source and binary dependencies via habitat.

inputs:
  concurrency:
    description: concurrency of requests
    default: '2'
    required: false
  cache-backend:
    description: cache backend for habitat
    default: 'lynx-infra'
    required: false
  target:
    description: habitat target
    default: ''
    required: false
  # actions/cache stores files with relative directory, which causes inconsistency between self-hosted runner and
  # container runner. Therefore, add this temporary option to modify cache key prefix as a workaround. Delete this when
  # we are able to adjust the container runner's directory structure to the same as self-hosted runner.
  cache-key-prefix:
    description: cache key prefix for cache action
    default: ''
    required: false

runs:
  using: composite
  steps:
    - name: setup cache action
      if: ${{ inputs.cache-backend == 'lynx-infra' }}
      uses: lynx-infra/cache@1f4c655e363ee8910dce6ee0fe9ab3289d676add
      with:
        path: ~/.habitat_cache
        key: hab${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ hashFiles('animax/.habitat', 'animax/DEPS') }}
        restore-keys: |
          hab${{ inputs.cache-key-prefix }}-${{ runner.os }}-

    - name: setup cache action
      if: ${{ inputs.cache-backend == 'github' }}
      uses: actions/cache@v4
      with:
        path: ~/.habitat_cache
        key: hab-${{ runner.os }}-${{ hashFiles('animax/.habitat', 'animax/DEPS') }}
        restore-keys: |
          hab-${{ runner.os }}-

    - name: install Python dependencies
      shell: bash
      working-directory: animax
      run: |
        retry_command() {
          local attempt=1
          local max_attempts=3
          until "$@"; do
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              return 1
            fi
            echo "env setup failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
        }

        retry_command tools/hab sync . --target tools_shared --target-only --no-history
        retry_command source tools/envsetup.sh
      env:
        HABITAT_CONCURRENCY: ${{ inputs.concurrency }}

    - name: run habitat sync
      shell: bash
      working-directory: animax
      run: |
        retry_hab_sync() {
          local attempt=1
          local max_attempts=3
          until "$@"; do
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              return 1
            fi
            echo "habitat sync failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
        }

        if [[ "${{ inputs.target }}" == "" ]]; then
          retry_hab_sync tools/hab sync .
        else
          retry_hab_sync tools/hab sync . --target "${{ inputs.target }}"
        fi
      env:
        HABITAT_CONCURRENCY: ${{ inputs.concurrency }}
