name: build android example

description: build android example apk

inputs:
  abi-list:
    description: The abi list of the sdk to publish
    required: false
    default: 'armeabi-v7a'
  build-params:
    description: Set project properties for gradle when building example
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Python Setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install Common Dependencies
      uses: ./animax/.github/actions/common-deps
    - name: Build Example App
      shell: bash
      run: |-
        cd $GITHUB_WORKSPACE/animax
        source tools/envsetup.sh
        pushd example/android
        ./gradlew :AnimaXExample:assembleNoasanRelease -Penable_trace=none -PabiList=${{ inputs.abi-list }} -no-daemon ${{ inputs.build-params }}
        popd
    - name: upload artifact
      uses: lynx-infra/upload-artifact@332ec52e99f7cbf1fbbdc9bcc09280d49147d092
      continue-on-error: true
      with:
        name: android-animax-example
        path: '${{ github.workspace }}/animax/example/android/animax_example/build/outputs/apk/noasan/release/AnimaXExample-noasan-release.apk'
