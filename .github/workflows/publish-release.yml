name: publish-release

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'snapshot base version'
        required: true
        type: string
      commitId:
        description: 'specific commit SHA to build'
        required: false
        type: string
      publish_maven:
        description: 'publish Android Maven artifacts on manual runs'
        required: false
        default: false
        type: boolean
      publish_cocoapods:
        description: 'publish iOS podspec to CocoaPods trunk on manual runs'
        required: false
        default: false
        type: boolean
  release:
    types: [published]

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
      checkout_ref: ${{ steps.get_version.outputs.CHECKOUT_REF }}
      release_mode: ${{ steps.get_version.outputs.RELEASE_MODE }}
    steps:
      - name: Get Version
        id: get_version
        run: |-
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_mode="snapshot"
          else
            release_mode="release"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
            checkout_ref="${{ github.event.inputs.commitId }}"
            if [[ -z "$checkout_ref" ]]; then
              checkout_ref="$GITHUB_SHA"
            fi
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            tag="${{ github.event.release.tag_name }}"
            checkout_ref="${{ github.event.release.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          fi
          version="${tag#v}"
          if [[ -n "${{ github.event.inputs.commitId || '' }}" && ! "${{ github.event.inputs.commitId || '' }}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "commitId must be a git SHA (7-40 hex chars)."
            exit 1
          fi
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Version is valid"
            echo "TAG=$tag" >> $GITHUB_OUTPUT
            echo "VERSION=$version" >> $GITHUB_OUTPUT
            echo "CHECKOUT_REF=$checkout_ref" >> $GITHUB_OUTPUT
            echo "RELEASE_MODE=$release_mode" >> $GITHUB_OUTPUT
          else
            echo "Version is invalid"
            exit 1
          fi

  android-sdk-release:
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'release' }}
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: animax
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Android environment
        uses: ./animax/.github/actions/setup-android-env
      - name: Install Common Dependencies
        uses: ./animax/.github/actions/common-deps
        with:
          cache-backend: 'lynx-infra'
      - name: Validate Maven publish secrets
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_maven == 'true' }}
        shell: bash
        env:
          PORTAL_API_TOKEN: ${{ secrets.PORTAL_API_TOKEN }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
        run: |-
          missing=()
          for name in PORTAL_API_TOKEN SIGNING_KEY_ID SIGNING_PASSWORD SIGNING_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Maven publish secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Android SDK Release
        id: android-sdk-release
        uses: ./animax/.github/actions/android-sdk-release
        with:
          version: ${{ needs.get-version.outputs.version }}
          signingKeyId: ${{ secrets.SIGNING_KEY_ID }}
          signingPassword: ${{ secrets.SIGNING_PASSWORD }}
          signingSecretKey: ${{ secrets.SIGNING_SECRET_KEY }}
          abiList: 'armeabi-v7a,x86_64,arm64-v8a'
          package_maven: ${{ (github.event_name == 'release' || github.event.inputs.publish_maven == 'true') && 'true' || 'false' }}
      - name: Upload Android release assets
        uses: actions/upload-artifact@v4
        with:
          name: animax-android-release-assets
          path: |
            animax/out/release/android/*
          if-no-files-found: error
      - name: Publish artifact to maven
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_maven == 'true' }}
        uses: lynx-infra/maven-publish-action@c48e3067642c7ceccf807cd52e6644a257cd8ded
        with:
          portal_api_token: ${{ secrets.PORTAL_API_TOKEN }}
          artifact_path_list: ${{ steps.android-sdk-release.outputs.maven_artifact_list }}

  android-sdk-snapshot-release:
    runs-on: lynx-ubuntu-22.04-large
    needs: get-version
    if: ${{ needs.get-version.outputs.release_mode == 'snapshot' }}
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: animax
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Android environment
        uses: ./animax/.github/actions/setup-android-env
      - name: Install Common Dependencies
        uses: ./animax/.github/actions/common-deps
        with:
          cache-backend: 'lynx-infra'
      - name: Validate snapshot publish secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        run: |-
          missing=()
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required snapshot publish secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Resolve Android snapshot version
        id: resolve_snapshot_version
        shell: bash
        run: |-
          version="${{ needs.get-version.outputs.version }}-SNAPSHOT"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - name: Android SDK Snapshot Release
        uses: ./animax/.github/actions/android-sdk-snapshot-release
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        with:
          version: ${{ steps.resolve_snapshot_version.outputs.VERSION }}
          abiList: 'armeabi-v7a,x86_64,arm64-v8a'

  ios-sdk-publish:
    timeout-minutes: 60
    runs-on: macos-14
    needs: get-version
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: animax
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6.10'
      - name: Resolve checkout commit
        id: checkout_commit
        shell: bash
        run: |-
          cd "$GITHUB_WORKSPACE/animax"
          echo "commit_id=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Common Dependencies
        uses: ./animax/.github/actions/common-deps
        with:
          cache-backend: 'lynx-infra'
      - name: Setup Ruby Cache
        uses: ./animax/.github/actions/ios-common-deps
      - name: Publish iOS SDK
        id: ios-sdk-publish
        uses: ./animax/.github/actions/ios-sdk-publish
        with:
          version: ${{ needs.get-version.outputs.version }}
          release_tag: ${{ needs.get-version.outputs.tag }}
          commit_id: ${{ steps.checkout_commit.outputs.commit_id }}
      - name: Upload iOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: animax-ios-release-assets
          path: animax/out/release/ios/*
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-22.04
    needs:
      - get-version
      - ios-sdk-publish
    timeout-minutes: 30
    steps:
      - name: Download iOS release assets
        uses: actions/download-artifact@v4
        with:
          name: animax-ios-release-assets
          path: release-assets
      - name: Prepare GitHub release assets
        shell: bash
        run: |-
          rm -rf github-release-assets
          mkdir -p github-release-assets
          while IFS= read -r asset; do
            cp "$asset" "github-release-assets/$(basename "$asset")"
          done < <(find release-assets -type f | sort)
          find github-release-assets -type f | sort
      - name: Upload GitHub release assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.get-version.outputs.tag }}
          commit: ${{ needs.get-version.outputs.checkout_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/github-release-assets/*'
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  publish-cocoapods:
    if: ${{ github.event_name == 'release' || github.event.inputs.publish_cocoapods == 'true' }}
    runs-on: macos-14
    needs:
      - get-version
      - github-release
    timeout-minutes: 60
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: animax
          ref: ${{ needs.get-version.outputs.checkout_ref }}
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6.10'
      - name: Download iOS release assets
        uses: actions/download-artifact@v4
        with:
          name: animax-ios-release-assets
          path: ios-release-assets
      - name: Validate CocoaPods publish secret
        shell: bash
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN || secrets.REPO_ANIMAX_COCOAPODS_TRUNK_TOKEN }}
        run: |-
          if [[ -z "$COCOAPODS_TRUNK_TOKEN" ]]; then
            echo "Missing required CocoaPods publish secret: COCOAPODS_TRUNK_TOKEN or REPO_ANIMAX_COCOAPODS_TRUNK_TOKEN." >&2
            exit 1
          fi
      - name: Publish to CocoaPods Repo
        shell: bash
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN || secrets.REPO_ANIMAX_COCOAPODS_TRUNK_TOKEN }}
        run: |-
          cd "$GITHUB_WORKSPACE/animax"
          export LANG=en_US.UTF-8
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          SDKROOT=$SDKROOT bundle install --path .bundle
          git config --global user.name "lynx.authors"
          git config --global user.email "lynx.authors@users.noreply.github.com"
          bundle exec pod repo add-cdn trunk https://cdn.cocoapods.org/
          COCOAPODS_TRUNK_TOKEN=$COCOAPODS_TRUNK_TOKEN bundle exec pod trunk push "$GITHUB_WORKSPACE/ios-release-assets/AnimaX.podspec" \
            --verbose \
            --skip-import-validation \
            --allow-warnings \
            --use-libraries
